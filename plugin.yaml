name: field-academy
version: 0.9.0
requires_hermes: ">=0.22.0"
manifest_version: 2
api_version: 1
description: "The School of Hermes. Learn Hermes by using it: Field Academy makes a practice profile with one problem planted in it, you do a job there, and it reads Hermes's own files and chat records to show what actually happened. Eleven Foundations missions come first, then five trails. Messenger, Traveler, Crossroads and Boundary Keeper climb from Beginner to a Capstone; Guide climbs from an audit to staged verification. Every trail ends at the summit, Olympus. Short spaced reviews, and a Field Record you save with a fingerprint for every file. Not issued or endorsed by Nous Research."
author: Damon Gardenhire
license: MIT
tags: [learning, progress-tracking, desktop]
provides_tools:
  - field_academy_snapshot
  - field_academy_mission
  - field_academy_grade_explanation
  - field_academy_grade_review
  - field_academy_grade_deployer
  - field_academy_record_evidence
provides_hooks:
  - post_tool_call
  - pre_llm_call
