name: field-academy
version: 0.9.0
requires_hermes: ">=0.22.0"
manifest_version: 2
api_version: 1
description: Learn Hermes by proving it. Eleven Foundations missions run in practice profiles Field Academy makes for you, each with a planted problem and a check that reads Hermes itself, then four paths from Beginner to Advanced and a Guide path for client work. Spaced review, and a Field Record you keep with a fingerprint for every file, your own self-issued learning record. Not issued or endorsed by Nous Research.
author: Damon Gardenhire
license: MIT
tags: [learning, progress-tracking, desktop]
provides_tools:
  - field_academy_snapshot
  - field_academy_mission
  - field_academy_grade_explanation
  - field_academy_grade_review
  - field_academy_grade_deployer
  - field_academy_record_evidence
provides_hooks:
  - post_tool_call
  - pre_llm_call
