name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Unit tests (stdlib only — no framework to install)
        run: python -m unittest discover -s tests -v

      - name: The desktop half parses as ESM
        run: |
          set -euo pipefail
          cp desktop/plugin.js /tmp/plugin.mjs
          node --check /tmp/plugin.mjs

      - name: Every component in the pane is imported or defined
        run: python scripts/check_identifiers.py desktop/plugin.js

      - name: Every arbitrary-value class resolves in the app's shipped CSS
        run: |
          set -euo pipefail
          # SKIPs cleanly here: the app's compiled stylesheet lives in the
          # hermes-agent checkout, which this repo does not carry. The check
          # runs for real on a machine that has Hermes Desktop installed.
          python scripts/check_plugin_css.py desktop/plugin.js

  admission:
    # The exact command the plugin-catalog CI runs on a submitted entry.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: NousResearch/hermes-agent/.github/actions/plugin-validate@main
        with:
          path: .
